services:
  db:
    image: postgres:15-alpine
    container_name: aegis_postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-aegis_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD environment variable is required}"
      POSTGRES_DB: "${POSTGRES_DB:-aegis_db}"
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aegis_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis_user} -d ${POSTGRES_DB:-aegis_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    command: redis-server --requirepass "${REDIS_PASSWORD:-aegis_demo_redis_secret_pass_32char}"
    networks:
      - aegis_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-aegis_demo_redis_secret_pass_32char}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis_backend
    command: sh -c "alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    volumes:
      - ./backend:/app
      - ./ml/artifacts:/ml/artifacts:ro
      - ./database/seeds:/database/seeds:ro
    ports:
      # Bound strictly to localhost loopback to prevent direct unauthenticated external exposure
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - "DATABASE_URL=${DATABASE_URL:?Error: DATABASE_URL environment variable is required}"
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-aegis-platform-demo-secret-key-32-chars-minimum}
      - ML_ARTIFACTS_DIR=/ml/artifacts
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-aegis_demo_redis_secret_pass_32char}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aegis_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegis_frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aegis_network

volumes:
  postgres_data:

networks:
  aegis_network:
    driver: bridge