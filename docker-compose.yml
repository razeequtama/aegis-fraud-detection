version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aegis_postgres
    environment:
      POSTGRES_USER: aegis_user
      POSTGRES_PASSWORD: aegis_password
      POSTGRES_DB: aegis_db
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aegis_network

  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    ports:
      - "6379:6379"
    networks:
      - aegis_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://aegis_user:aegis_password@db:5432/aegis_db
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis
    networks:
      - aegis_network

volumes:
  postgres_data:

networks:
  aegis_network:
    driver: bridge